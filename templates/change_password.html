{% extends "base.html" %}
{% block title %}Change Password — FBR Invoice{% endblock %}
{% block breadcrumb %}Change Password{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-sm-8 col-md-5">
    <div class="card">
      <div class="card-header fw-semibold">
        <i class="bi bi-lock me-2"></i>Change Password
      </div>
      <div class="card-body p-4">
        <form method="POST" action="{{ url_for('change_password') }}" novalidate>
          <div class="mb-3">
            <label class="form-label fw-semibold">Current Password</label>
            <input type="password" name="current_password" class="form-control"
                   placeholder="Enter current password" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">New Password</label>
            <input type="password" name="new_password" id="newPw" class="form-control"
                   placeholder="Min 8 characters" required minlength="8">
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Confirm New Password</label>
            <input type="password" name="confirm_password" id="confPw" class="form-control"
                   placeholder="Repeat new password" required>
          </div>
          <div class="d-flex gap-2">
            <a href="{{ url_for('user_profile') }}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary flex-grow-1">
              <i class="bi bi-save me-1"></i>Update Password
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
document.querySelector('form').addEventListener('submit', function(e) {
  if (document.getElementById('newPw').value !== document.getElementById('confPw').value) {
    e.preventDefault();
    alert('Passwords do not match.');
    document.getElementById('confPw').focus();
  }
});
</script>
{% endblock %}
